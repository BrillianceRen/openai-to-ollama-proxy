[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-ollama-proxy"
version = "1.1.0"
description = "OpenAI-compatible API -> Ollama API proxy (stdlib only), for VS Code / VS Copilot custom models"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ollama", "openai", "proxy", "copilot", "multimodal", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
openai-ollama-proxy = "openai_ollama_proxy:main"

[tool.setuptools]
py-modules = ["openai_ollama_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"