[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-bridge"
version = "1.3.0"
description = "OpenAI / Gemini / Vertex AI / Antigravity API -> Ollama & OpenAI API bridge (stdlib only), for VS Copilot custom models"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ollama", "openai", "gemini", "vertex", "antigravity", "proxy", "bridge", "copilot", "multimodal", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
vertex = ["google-genai>=1.0.0"]
all = ["google-genai>=1.0.0"]
dev = ["google-genai>=1.0.0", "pytest>=7.0"]

[project.scripts]
openai-ollama-proxy = "openai_ollama_proxy:main"
gemini-ollama-proxy = "gemini_ollama_proxy:main"
vertex-ollama-proxy = "vertex_ollama_proxy:main"
antigravity-ollama-proxy = "antigravity_ollama_proxy:main"

[tool.setuptools]
py-modules = ["openai_ollama_proxy", "gemini_ollama_proxy", "vertex_ollama_proxy", "antigravity_ollama_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"